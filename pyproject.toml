[project]
name = "simulatte"
version = "0.11.0"
description = "A discrete-event simulation framework for intralogistics and operations management"
readme = "README.md"
authors = [
    { name = "Davide Mezzogori", email = "dmezzogori@users.noreply.github.com" },
    { name = "Nicola Mercogliano", email = "nmercogl@users.noreply.github.com" },
]
license = "MIT"
requires-python = ">=3.11"
keywords = ["simulation", "discrete-event", "intralogistics", "operations", "simpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "simpy>=4.0.1",
    "matplotlib>=3.7.2",
    "tabulate>=0.9.0",
    "loguru>=0.7.2",
    "tqdm>=4.67.1",
    "gymnasium>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  "docs/",
  "specs/",
  "plans/",
  "tests/",
  "overrides/",
  ".claude/",
  ".github/",
  ".vscode/",
  ".pre-commit-config.yaml",
  "codecov.yml",
  "zensical.toml",
  "uv.lock",
]

[dependency-groups]
dev = [
    "mkdocstrings[python]>=1.0.4",
    "pre-commit>=3.3.3",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "pyyaml>=6.0",
    "ruff>=0.1.5",
    "ty>=0.0.1a32",
    "zensical>=0.0.14",
]

[tool.pytest.ini_options]
addopts = "--cov=src/simulatte --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=99 -v"
testpaths = ["tests"]
# Per-test timeout: a hung test fails fast with a full thread-stack dump instead of
# stalling the job to the 20-min runner cap. The `thread` method dumps every thread's
# traceback and hard-exits, so it catches hangs even in C calls or non-main threads.
# Set as ini keys (not in addopts) so the PyPy lane's `-o addopts=...` override keeps them.
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
exclude_also = [
    "\\.\\.\\.$",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 120

# Python 3.11 floor: PyPy's latest release is 3.11, so the package stays within the
# 3.11 language to remain PyPy-compatible. This also disables the pyupgrade rules
# (UP040/UP046) that would otherwise demand PEP 695 (3.12+) syntax.
target-version = "py311"

[tool.ruff.lint]
# Enable pycodestyle (`E`), Pyflakes (`F`), flake8-future-annotations (`FA`),
# pyupgrade (`UP`), and unused-noqa detection (`RUF100`).
select = ["E", "F", "FA", "UP", "RUF100"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/*.py" = ["S101", "SLF001"]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[project.urls]
Homepage = "https://simulatte.dev"
Repository = "https://github.com/dmezzogori/simulatte"
Documentation = "https://simulatte.dev"
