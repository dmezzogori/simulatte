name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 3.15 is a pre-release lane (#36): it reports but cannot fail the workflow
    # until 3.15.0 final ships and the lane becomes a required check.
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install dependencies
        run: uv sync --dev --python ${{ matrix.python-version }} --frozen

      - name: Check lockfile is up-to-date
        if: matrix.python-version == '3.14'
        run: uv lock --check

      - name: Run linting
        if: matrix.python-version == '3.14'
        run: uv run ruff check src tests

      - name: Run type checking
        if: matrix.python-version == '3.14'
        run: uv run ty check src

      - name: Run tests with coverage
        run: uv run pytest

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

  # PyPy compatibility lane. PyPy's latest is 3.11, so this guards the Python 3.11
  # language floor and verifies simulatte runs on PyPy. Coverage is disabled here
  # (PyPy lacks coverage's C tracer; the CPython 3.14 lane enforces the gate), and
  # tests/experimental is excluded (it needs numpy/gymnasium, RL-only best-effort).
  test-pypy:
    name: test (pypy-3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install PyPy 3.11
        run: uv python install pypy-3.11

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install dependencies (PyPy)
        run: uv sync --dev --python pypy-3.11

      - name: Run tests on PyPy (core + intralogistics, coverage disabled)
        env:
          MPLBACKEND: Agg
        run: uv run --python pypy-3.11 pytest tests/core tests/intralogistics -o addopts="-q -p no:cacheprovider"

  # TypeScript conformance reader (gate G2): the studio trace package reads the committed trace fixtures
  # and must reproduce the states the Python reader wrote into their expected JSON.
  trace-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Enable corepack (pnpm version comes from studio/package.json)
        run: corepack enable

      - name: Install dependencies
        run: pnpm -C studio install --frozen-lockfile

      - name: Type check
        run: pnpm -C studio typecheck

      - name: Run tests
        run: pnpm -C studio test

  # Overhead gate (spec §14, gate G3): the branch against simulatte==0.12.0, installed in two environments of
  # the same job, on the same pre-generated workloads (benchmarks/README.md). Only mode `none` can fail the job,
  # above BUDGET + NOISE median overhead; digest/full ratios, trace size, seeks, memory and sampling are reported in
  # the step summary. Expected duration (estimated from local timings): about 6 minutes on CPython and 9 on PyPy,
  # setup included.
  bench:
    name: bench (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # NOISE: noise band calibrated at G3 (specs/research/sp1-g3-report.md §3), added to the 3 % budget.
          - python: "3.14"
            warmup: 1
            noise: "0.02"
          - python: pypy-3.11
            warmup: 8  # the JIT settles after about 7 runs of the CI workload
            noise: "0.05"
    env:
      BUDGET: "0.03"
      NOISE: ${{ matrix.noise }}
      RUN: --warmup ${{ matrix.warmup }} --repeat 5 --processes 3
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Install ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Create the environments (branch, then simulatte==0.12.0 with the same dependency versions)
        run: |
          uv venv /tmp/head --python ${{ matrix.python }}
          uv pip install --python /tmp/head .
          uv pip freeze --python /tmp/head | grep -v '^simulatte' > /tmp/constraints.txt
          uv venv /tmp/base --python ${{ matrix.python }}
          uv pip install --python /tmp/base simulatte==0.12.0 --constraint /tmp/constraints.txt
          mkdir -p /tmp/out

      - name: Mode none against 0.12.0 (gate)
        working-directory: benchmarks
        run: |
          echo "### Overhead gate, ${{ matrix.python }}: budget ${BUDGET}, noise band ${NOISE}" >> "$GITHUB_STEP_SUMMARY"
          status=0
          header=""
          for w in jobshop10-u90-5k jobshop10-u95-5k; do
            /tmp/base/bin/python run.py --mode none --workload workloads/$w.json $RUN --json /tmp/out/base-none-$w.json
            /tmp/head/bin/python run.py --mode none --workload workloads/$w.json $RUN --json /tmp/out/head-none-$w.json
            /tmp/head/bin/python compare.py /tmp/out/base-none-$w.json /tmp/out/head-none-$w.json \
              --budget "$BUDGET" --noise "$NOISE" --summary "$GITHUB_STEP_SUMMARY" $header || status=1
            header=--no-header
          done
          exit $status

      - name: Modes digest and full, sampling (reported only)
        if: success() || failure()
        working-directory: benchmarks
        run: |
          w=jobshop10-u90-5k
          echo "### Recording modes and sampling, ${{ matrix.python }} (not gated)" >> "$GITHUB_STEP_SUMMARY"
          header=""
          for mode in digest full; do
            /tmp/head/bin/python run.py --mode $mode --workload workloads/$w.json $RUN --json /tmp/out/head-$mode-$w.json
            /tmp/head/bin/python compare.py /tmp/out/head-none-$w.json /tmp/out/head-$mode-$w.json \
              --summary "$GITHUB_STEP_SUMMARY" $header
            header=--no-header
          done
          /tmp/base/bin/python bench_sampling.py --jobs 20000 --warmup ${{ matrix.warmup }} --repeat 5 --json /tmp/out/base-sampling.json
          /tmp/head/bin/python bench_sampling.py --jobs 20000 --warmup ${{ matrix.warmup }} --repeat 5 --json /tmp/out/head-sampling.json
          /tmp/head/bin/python compare.py /tmp/out/base-sampling.json /tmp/out/head-sampling.json \
            --summary "$GITHUB_STEP_SUMMARY" --no-header
          /tmp/head/bin/python summarize.py /tmp/out/*.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the benchmark results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.python }}
          path: /tmp/out/*.json
