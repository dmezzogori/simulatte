name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install dependencies
        run: uv sync --dev --all-extras --python 3.12 --frozen

      - name: Set up Node.js for Studio assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Build Studio assets
        run: |
          corepack enable
          cd studio
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          uv run python studio/scripts/package_assets.py

      - name: Build simulatte wheel into the docs site
        run: ./scripts/build_docs_wheel.sh

      - name: Build site
        run: uv run --all-extras zensical build --clean
      - name: Check internal documentation links
        run: uv run --all-extras python scripts/check_docs_links.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  runnable-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Set up Node.js for Studio assets
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Build Studio assets
        run: |
          corepack enable
          cd studio
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          uv run python studio/scripts/package_assets.py

      - name: Build wheel into docs site
        run: ./scripts/build_docs_wheel.sh
      - name: Unit-test the extractor
        run: node --test scripts/docs/extract-runnable.test.mjs
      - name: Run tagged docs blocks under Pyodide
        run: cd scripts/docs && npm ci && node smoke-runnable.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
