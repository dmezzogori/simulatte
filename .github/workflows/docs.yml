name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev

      - name: Install dependencies
        run: uv sync --dev --python 3.12 --frozen

      - name: Build simulatte wheel into the docs site
        run: ./scripts/build_docs_wheel.sh

      - name: Build site
        run: uv run zensical build --clean

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  runnable-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build wheel into docs site
        run: ./scripts/build_docs_wheel.sh
      - name: Unit-test the extractor
        run: node --test scripts/docs/extract-runnable.test.mjs
      - name: Run tagged docs blocks under Pyodide
        run: cd scripts/docs && npm ci && node smoke-runnable.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
