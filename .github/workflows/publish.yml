name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Check lockfile is up-to-date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --all-groups --all-extras --frozen

      - name: Run tests
        run: uv run --all-extras pytest

      - name: Run linting
        run: uv run --all-extras ruff check

      - name: Run formatting check
        run: uv run --all-extras ruff format --check

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - name: Build Studio assets
        run: |
          corepack enable
          cd studio
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          uv run python studio/scripts/package_assets.py

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-files
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    environment: release
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-files
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

      - name: Publish to PyPI
        run: uv publish --trusted-publishing automatic
