[project]
site_name = "Simulatte"
site_url = "https://simulatte.dev/"
repo_url = "https://github.com/dmezzogori/simulatte"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
extra_css = ["assets/stylesheets/pyodide-run.css", "assets/stylesheets/version-badge.css"]
extra_javascript = ["assets/javascripts/pyodide-run.js"]

nav = [
  { "Introduction" = [
    { "Overview" = "index.md" },
    { "Installation" = "introduction/installation.md" },
    { "Running on PyPy" = "running-on-pypy.md" },
    { "Basic Usage" = "introduction/basic-usage.md" },
    { "Core Concepts & Architecture" = "introduction/architecture.md" },
  ]},
  { "Guides" = [
    { "Overview" = "guides/index.md" },
    { "Production Planning & Control" = "guides/production-planning.md" },
    { "Intralogistics" = "guides/intralogistics.md" },
    { "Reinforcement Learning" = "guides/reinforcement-learning.md" },
    { "Troubleshooting" = "guides/troubleshooting.md" },
  ]},
  { "Tutorials" = [
    { "Overview" = "tutorials/index.md" },
    { "Basic manufacturing system" = "tutorials/basic-manufacturing-system.md" },
    { "Release control and dispatching" = "tutorials/release-control-and-dispatching.md" },
    { "ShopFloor extensibility" = "tutorials/shopfloor-extensibility.md" },
    { "Multi-run experiments" = "tutorials/multi-run-experiments.md" },
    { "Logging" = "tutorials/logging.md" },
    { "Gymnasium wrapper (RL)" = "tutorials/gymnasium-wrapper.md" },
    { "Comparing release policies" = "tutorials/comparing-release-policies.md" },
    { "Building an AGV system" = "tutorials/building-an-agv-system.md" },
  ]},
  { "Examples" = [
    { "Overview" = "examples/index.md" },
    { "Benchmark shop environments" = "examples/benchmark-shops.md" },
    { "Dispatching — stateless rules" = "examples/dispatching-stateless.md" },
    { "Dispatching — parameterized rules" = "examples/dispatching-parameterized.md" },
    { "Dispatching — system-state (FOCUS)" = "examples/dispatching-focus.md" },
    { "Release — workload control" = "examples/release-workload.md" },
    { "Release — WIP cap" = "examples/release-wip.md" },
    { "Release — triggers & starvation" = "examples/release-triggers.md" },
    { "Intralogistics" = "examples/intralogistics.md" },
  ]},
  { "API Reference" = [
    { "Overview" = "api/index.md" },
    { "Core" = "api/core.md" },
    { "Release Policies" = "api/release-policies.md" },
    { "Dispatching Rules" = "api/dispatching-rules.md" },
    { "Intralogistics" = "api/intralogistics.md" },
    { "Utilities" = "api/utilities.md" },
    { "Experimental" = "api/experimental.md" },
  ]},
  { "Development" = [
    { "Contributing" = "development/contributing.md" },
    { "Agent Skill" = "development/agent-skill.md" },
    { "Changelog" = "development/changelog.md" },
  ]},
]

[project.extra.analytics]
provider = "custom"

[project.markdown_extensions."pymdownx.highlight"]
use_pygments = true

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid" },
]

[project.plugins.mkdocstrings.config]
enabled = true

[project.plugins.mkdocstrings.config.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.config.handlers.python.options]
show_source = false
show_root_heading = true
show_root_full_path = false
show_root_toc_entry = true
show_signature = true
separate_signature = true
show_signature_annotations = true
heading_level = 2
members = false

[project.theme]
custom_dir = "overrides"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.tabs",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tracking",
  "toc.follow",
]

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
