[project]
site_name = "Simulatte"
site_url = "https://simulatte.dev/"
repo_url = "https://github.com/dmezzogori/simulatte"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Tutorials" = [
    { "Overview" = "tutorials/index.md" },
    { "Basic manufacturing system" = "tutorials/basic-manufacturing-system.md" },
    { "Release control and dispatching" = "tutorials/release-control-and-dispatching.md" },
    { "ShopFloor extensibility" = "tutorials/shopfloor-extensibility.md" },
    { "Multi-run experiments" = "tutorials/multi-run-experiments.md" },
    { "Logging" = "tutorials/logging.md" },
    { "Troubleshooting" = "tutorials/troubleshooting.md" },
  ]},
  { "Intralogistics" = [
    { "Overview" = "intralogistics/index.md" },
    { "Examples" = "intralogistics/examples.md" },
  ]},
  { "API Reference" = "reference.md" },
  { "Agent Skill" = "ai-skill.md" },
  { "Experimental" = [
    { "Overview" = "experimental/index.md" },
    { "Gymnasium wrapper for RL" = "experimental/gymnasium-wrapper.md" },
  ]},
]

[project.extra.analytics]
provider = "custom"

[project.markdown_extensions."pymdownx.highlight"]
use_pygments = true

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid" },
]

[project.plugins.mkdocstrings.config]
enabled = true

[project.plugins.mkdocstrings.config.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.config.handlers.python.options]
show_source = false
show_root_heading = true
show_root_full_path = false
show_root_toc_entry = true
show_signature = true
separate_signature = true
show_signature_annotations = true
heading_level = 2
members = false

[project.theme]
custom_dir = "overrides"
features = [
  "content.action.edit",
  "content.action.view",
  "navigation.instant",
  "navigation.sections",
  "navigation.tracking",
  "toc.follow",
]

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
